model:
  model_type: "unet_pp"            # Model type (e.g., unet, deeplabv3)
  n_channels: 4                 # Number of input channels (e.g., RGB image has 3 channels)
  n_classes: 1                  # Number of output classes for the segmentation task
  conf_threshold: 0.75           # Confidence threshold for the segmentation task
  encoder: "se_resnext50_32x4d"    # choose from https://smp.readthedocs.io/en/latest/encoders.html, only supported for smp models

training:
  wandb_project_name: 'Samuel_building_segmentation'     # Name of the Weights & Biases project
  optim: 'adam'
  loss: 'FocalLoss'     # Loss function to use (e.g., BCEWithLogitsLoss, CrossEntropyLoss)
  loss_req_sig: True
  learning_rate: 2e-4            # Learning rate for the optimizer
  weight_decay: 1e-8            # Weight decay (L2 regularization)
  momentum: 0.999               # Momentum for optimizer (e.g., RMSprop or SGD)
  amp: False                    # Automatic Mixed Precision (True/False)
  reduce_lr_metric: 'val_loss'  # Metric to use for learning rate reduction
  reduce_lr_patience: 15         # Number of epochs to wait before reducing learning rate
  reduce_lr_factor: 0.75         # Factor to reduce learning rate by
  early_stopping_patience: 30

  pl_settings:
    checkpoint_saving_metric: "val_loss"
    early_stop_metric: "val_loss"
    accelerator: 'cuda'
    devices:  [1]
    strategy: "ddp"
    check_val_every_n_epoch: 1 # has to be int
    log_every_n_steps: 100
    #val_check_interval: 10 # float for percentage 0.25
    max_epochs: 100000
    limit_val_batches: 1000
    continue_training: False #"logs/building_comparison/2024-10-10_22-35-39/last.ckpt"
    load_weights_only: False #"logs/building_comparison_DL/2024-11-06_12-23-45/last.ckpt" # false, or ckpt path

data:
  dataset_type: "RS"            # ["fake", "RS"]
  bands: 4                      # Number of bands in the input image
  use_cropped_image: True
  use_256_subsample: True
  resample_512: False
  interpolation_size: 512       # Size of the interpolated image
  interpolation_type: 'bicubic' # Type of interpolation to use
  crop: True                    # Crop the image to the wanted size
  data_type: 'sr_4band'               # Type of data to use (e.g., lr,sr,hr)
  no_workers: 31 #16                # Number of workers for the DataLoader
  batch_size: 32                # Batch size for the DataLoader
  data_path: '/data/USERS/shollend/metadata/stratification_tables/'
  input_path: '/data/USERS/shollend/sentinel2/sr_inference/deepsent/predicted_merged/'
  target_path: '/data/USERS/shollend/combined_download/output/hr_mask/'
  img_post: 'tif'


